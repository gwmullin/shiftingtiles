<!DOCTYPE html>
<html>
	<head>
		<script src="jquery-1.8.3.js"></script>
		<script src="shiftingtiles.js"></script>
		<link rel="stylesheet/less" type="text/css" href="shiftingtiles.less">
		<script src="less-2.5.1.min.js" type="text/javascript"></script>
	</head>
	<body>
		<div class="gallery"></div>
		<script>
			$(document).ready(function() {
				let imageArray = [];
				let initialized = false;

				function fetchImages() {
					$.getJSON('/api/images', function(images) {
						if (!initialized) {
							if (images.length === 0) {
								console.warn("No images available yet, retrying...");
								setTimeout(fetchImages, 2000);
								return;
							}
							imageArray.push.apply(imageArray, images);
							$(".gallery").shiftingtiles(imageArray);
							initialized = true;
						} else {
							const known = {};
							imageArray.forEach(img => { known[img.src] = true; });
							images.forEach(img => {
								if (!known[img.src]) {
									imageArray.push(img);
								}
							});
						}
					}).fail(function(jqxhr, textStatus, error) {
						console.error("Failed to fetch images:", textStatus, error);
					});
				}

				// Fetch config for refresh interval
				$.getJSON('/api/config', function(config) {
					const refreshInterval = config.refreshInterval || 300000; // Default 5 mins
					
					// Initial fetch
					fetchImages();
					
					// Set up polling
					setInterval(fetchImages, refreshInterval);
				}).fail(function() {
					console.error("Failed to fetch config, using default interval");
					// Initial fetch with default polling
					fetchImages();
					setInterval(fetchImages, 300000);
				});
			});
		</script>
	</body>
</html>
