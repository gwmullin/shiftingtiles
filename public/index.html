<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Shifting Tiles</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="style.css">
</head>
<body class="idle" data-bounce="natural">
	<main id="stage" aria-label="Photo screensaver"></main>

	<div id="overlay"><div class="msg">Loading photos…</div></div>

	<button id="gear" title="Settings" aria-label="Open settings">
		<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
			<path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
		</svg>
	</button>

	<dialog id="settings" aria-label="Screensaver settings">
		<h2>Settings</h2>
		<form method="dialog">
			<label>Animation speed
				<span class="control">
					<input type="range" id="set-speed" min="0.25" max="3" step="0.05">
					<output id="out-speed"></output>
				</span>
			</label>
			<label>New image delay
				<span class="control">
					<input type="range" id="set-delay" min="1" max="30" step="0.5">
					<output id="out-delay"></output>
				</span>
			</label>
			<label>Panorama pan speed
				<span class="control">
					<input type="range" id="set-pan-speed" min="0" max="3" step="0.05">
					<output id="out-pan-speed"></output>
				</span>
			</label>
			<label>Bounce intensity
				<span class="control">
					<input type="range" id="set-bounce" min="0" max="40" step="1">
					<output id="out-bounce"></output>
				</span>
			</label>
			<label>Bounce behavior
				<span class="control">
					<select id="set-bounce-mode">
						<option value="natural">Natural</option>
						<option value="gravity">Gravity</option>
						<option value="elastic">Elastic</option>
						<option value="none">Smooth (no bounce)</option>
					</select>
				</span>
			</label>
			<label>Image size
				<span class="control">
					<input type="range" id="set-size" min="12" max="70" step="1">
					<output id="out-size"></output>
				</span>
			</label>
			<label>Small tiles
				<span class="control">
					<input type="range" id="set-small" min="0" max="100" step="1">
					<output id="out-small"></output>
				</span>
			</label>
			<label>Border between images
				<span class="control">
					<input type="range" id="set-border" min="0" max="30" step="1">
					<output id="out-border"></output>
				</span>
			</label>
			<label>Rows
				<span class="control">
					<input type="range" id="set-rows" min="2" max="4" step="1">
					<output id="out-rows"></output>
				</span>
			</label>
			<div class="buttons">
				<button type="button" id="set-reset">Reset defaults</button>
				<button value="close">Close</button>
			</div>
		</form>
	</dialog>

	<script src="app.js"></script>
</body>
</html>
